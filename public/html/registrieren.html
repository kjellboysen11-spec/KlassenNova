<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlassenNova / Registrieren</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="background">
        <div class="loginBlock">
            <div class="loginBlockTop">
                <h1 class="loginBlockTopLogin">Registrieren</h1>
            </div>
            <form id="registerForm">
            <div class="loginBlockInputs">
                <div class="loginBlockInputsEmailBlock">
                    <input type="email" name="email" id="email" placeholder="Email..." class="loginBlockInputsEmail" required>
                </div>
                <div class="loginBlockInputsPasswortBlock">
                    <input type="password" name="password" id="password" placeholder="Passwort..." class="loginBlockInputsPasswort" required>
                </div>
                <div class="loginBlockInputsPasswortBlock">
                    <input type="password" name="passwordConfirm" id="passwordConfirm" placeholder="Passwort bestätigen..." class="loginBlockInputsPasswort" required>
                </div>
                <div class="loginBlockError" id="registerError"></div>
            </div>
            <div class="loginBlockButttons"> 
                <div class="loginBlockButttonsBlock"> 
                    <div class="loginBlockButttonsLogin"> 
                        <button type="submit" class="loginBlockButttonsLoginDesign">Registrieren</button>
                    </div> 
                </div>
            </div>
            </form>
            <div class="loginBlockTxt">
                <p>Du hast schon ein Konto <a href="/html/login.html" class="loginBlockTxtA">Login</a></p>
            </div>
        </div>
    </div>

    <script src="/js/registrieren.js"></script>

</body>
</html>
