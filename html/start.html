<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlassenNova / Start</title>
    <link rel="stylesheet" href="/css/start.css">
</head>
<body>
    
   <aside class="setup-page">
    <div class="setup-card-home">
        <div class="setup-header">
            <div class="setup-brand">
                <img src="/img/logo.png" alt="KlassenNova Logo" class="setup-logo">
                <h1 class="setup-title">KlassenNova</h1>
            </div>
            <div class="setup-avatar" aria-label="Aktueller Nutzer">A</div>
        </div>
        <div class="setup-streak">
            
            <div class="setup-streak-week1">
                <div class="setup-streak-container">
                    <div class="setup-streak-day">
                        <img src="/img/Steak-Of-Start.png" alt="" class="setup-streak-img">
                    </div>
                </div>
                <div class="setup-streak-container">
                    <div class="setup-streak-day">
                        <img src="/img/Steak-Of-Start.png" alt="" class="setup-streak-img">
                    </div>
                </div>
                <div class="setup-streak-container">
                    <div class="setup-streak-day">
                        <img src="/img/Steak-Of-Start.png" alt="" class="setup-streak-img">
                    </div>
                </div>
                <div class="setup-streak-container">
                    <div class="setup-streak-day">
                        <img src="/img/Steak-Of-Start.png" alt="" class="setup-streak-img">
                    </div>
                </div>
                <div class="setup-streak-container">
                    <div class="setup-streak-day">
                        <img src="/img/Steak-Of-Start.png" alt="" class="setup-streak-img">
                    </div>
                </div>
                <div class="setup-streak-container">
                    <div class="setup-streak-day">
                        <img src="/img/Steak-Of-Start.png" alt="" class="setup-streak-img">
                    </div>
                </div>
                <div class="setup-streak-container">
                    <div class="setup-streak-day">
                        <img src="/img/Steak-Of-Start.png" alt="" class="setup-streak-img">
                    </div>
                </div>
            </div>
        </div>

        <div class="setup-faecher">
            <div class="setup-faecher-header">
                <h4 class="setup-faecher-title">Angepinnte Fächer</h4>
            </div>
            <div class="setup-faecher-body">
                <div class="setup-faecher-body-container-top">
                <div class="setup-faecher-container">
                    <button class="setup-faecher-button"><img src="/img/Mathe-Start.png" class="setup-faecher-img"></button>
                </div>
                <div class="setup-faecher-container">
                    <button class="setup-faecher-button"><img src="/img/Deutsch-Start.png" class="setup-faecher-img"></button>
                </div>
                <div class="setup-faecher-container">
                    <button class="setup-faecher-button"><img src="/img/Englisch-Start.png" class="setup-faecher-img"></button>
                </div>
                <div class="setup-faecher-container">
                    <button class="setup-faecher-button"><img src="/img/Bio-Start.png" class="setup-faecher-img"></button>
                </div>
                </div>
            </div>

            <div class="setup-faecher-body">
                <div class="setup-faecher-body-container-top">
                <div class="setup-faecher-container">
                    <button class="setup-faecher-button"><img src="/img/Weltkunde-Start.png" alt="" class="setup-faecher-img"></button>
                </div>
                <div class="setup-faecher-container">
                    <button class="setup-faecher-button"><img src="/img/Musik-Start.png" alt="" class="setup-faecher-img"></button>
                </div>
                <div class="setup-faecher-container">
                    <button class="setup-faecher-button"><img src="/img/Informatik-Start.png" alt="" class="setup-faecher-img"></button>
                </div>
                <div class="setup-faecher-container">
                    <button class="setup-faecher-button"><img src="/img/Lern-Karten-Start.png" alt="" class="setup-faecher-img"></button>
                </div>
                </div>
            </div>

            <div class="setup-faecher-all">
                <button class="setup-faecher-all-button">Alle Fächer</button>
            </div>
        </div>

        <!-- Hier aufgehört -->

        <div class="setup-lernziel">
            <div class="setup-lernziel-header">
                <h4 class="setup-lernziel-title">Lernziel</h4>
            </div>
            <div class="setup-lernziel-block">
                <div class="setup-lernziel-block-header">
                    <h4 class="setup-lernziel-block-title">45 Minuten</h4>
                </div>
                <div class="setup-lernziel-bar">
                     <div class="setup-lernziel-bar-rand">
                        <div class="setup-lernziel-bar-fuellung"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="setup-down-bar">
            <div class="setup-down-bar-1">
                <button class="setup-down-bar-button"><img src="/img/Home-Symbol-Start.png" alt="" class="setup-down-bar-img"></button>
            </div>
            <div class="setup-down-bar-2">
                <button class="setup-down-bar-button"><img src="/img/Lern-Karten-Symbol-Start.png" alt="" class="setup-down-bar-img"></button>
            </div>
            <div class="setup-down-bar-3">
                <button class="setup-down-bar-button"><img src="/img/Steak-Of-Start.png" alt="" class="setup-down-bar-img"></button>
            </div>
            <div class="setup-down-bar-4">
                <button class="setup-down-bar-button"><img src="/img/Einstellungs-Symbol-Start.png" alt="" class="setup-down-bar-img"></button>
            </div>
        </div>
    </div>

    <!--Streak-->

    <div class="setup-card-streak" hidden>

        </div>

   </aside> 

</body>
</html>
