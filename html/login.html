<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlassenNova / Login</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    
    <div class="background">
        <div class="loginBlock">
            <div class="loginBlockTop">
                <h1 class="loginBlockTopLogin">Login</h1>
            </div>
            <div class="loginBlockInputs">
                <div class="loginBlockInputsEmailBlock">
                    <input type="email" placeholder="Email..." class="loginBlockInputsEmail">
                </div>
                <div class="loginBlockInputsPasswortBlock">
                    <input type="password" placeholder="Passwort..." class="loginBlockInputsPasswort">
                </div>
            </div>
            <div class="loginBlockButttons"> 
                <div class="loginBlockButttonsBlock"> 
                    <div class="loginBlockButttonsLogin"> 
                        <button class="loginBlockButttonsLoginDesign">Login</button>
                    </div> 
                    <div class="loginBlockButttonsGoogle">
                        <button class="loginBlockButttonsGoogleDesign">Google</button>
                    </div>
                </div>
            </div>
            <div class="loginBlockTxt">
                <p>Du hast noch kein Konto <a href="/html/registrieren.html" class="loginBlockTxtA">Registrieren</a></p>
            </div>
        </div>
    </div>

</body>
</html>
